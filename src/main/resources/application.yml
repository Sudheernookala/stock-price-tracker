spring:
  application:
    name: stock-price-tracker
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stocktracker?reWriteBatchedInserts=true}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:1GB}
      max-request-size: ${MAX_UPLOAD_SIZE:1GB}

app:
  trading-zone: ${TRADING_ZONE:America/New_York}
  folder:
    dir: ${FOLDER_DIR:./data/input}

logging:
  level:
    # DEBUG also shows every rejected row and which trading day a summary request used.
    com.solactive.stocktracker: ${LOG_LEVEL:DEBUG}

management:
  endpoints:
    web:
      exposure:
        include: health        # only the health check; no other internal endpoints
